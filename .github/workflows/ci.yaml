name: CI

on: [push, pull_request]

env:
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  fmt_clippy_docs:
    name: Check fmt, clippy & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-features --all-targets
      - name: docs
        run: cargo doc --workspace --all-features --no-deps

  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests (all features)
        run: cargo test --workspace --all-features

      - name: Check without default features
        run: cargo check --workspace --no-default-features

      # each feature on its own, so a feature that only works alongside another is caught
      - name: Run tests (each feature alone)
        run: |
          for feature in chrono jiff serde time; do
            cargo test --workspace --lib --no-default-features --features "$feature"
          done

  fuzz:
    name: Build fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check fuzz crate
        run: cargo check --manifest-path fuzz/Cargo.toml
